[project]
name = "mysql-export-tool"
version = "0.1.0"
description = "MySQL 数据导出工具（GUI + 单文件 exe）"
requires-python = ">=3.11"
dependencies = ["PyMySQL>=1.1", "PySide6>=6.9.2,<6.12", "PySide6-Fluent-Widgets==1.11.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.19", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
